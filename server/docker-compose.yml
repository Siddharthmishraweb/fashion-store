services:
  db:
    image: postgres:16-alpine
    container_name: vastrika-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vastrika
      POSTGRES_PASSWORD: vastrika
      POSTGRES_DB: vastrika
    ports:
      - '5432:5432'
    volumes:
      - vastrika-pgdata:/var/lib/postgresql/data
    # Tuned for a small production node; raise shared_buffers with available RAM.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vastrika -d vastrika']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vastrika-pgdata:
