name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build storefront
        env:
          GITHUB_PAGES: 'true'
          # Vault: Secrets first, then Variables. Default true so Pages runs without a server.
          VITE_USE_MOCK: ${{ secrets.USE_MOCK || vars.USE_MOCK || 'true' }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_NAME: Vastrika
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
